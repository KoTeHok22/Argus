
/**:
  ros__parameters:
    frame_id_lidar: ""
    publish_diagnostics: true

    cloud:
      input_topic: /lidar_points
      qos_depth: 10
      min_range: 0.5
      max_range: 400.0
      max_abs_coord: 1.0e4
      drop_zero_xyz: true
      drop_nonfinite: true
      echo_multiplier: 0

    range_image:
      rings: 0
      az_steps: 0
      prefer_ring_field: true

    ground_segmentation:
      enabled: true
      method: z_threshold
      sensor_height: -1.075
      num_zones: 4
      num_sectors: 0
      enable_RNR: true
      enable_TGR: true
      rail_max_height: 0.55
      rail_max_width: 0.15
      rail_zone_m: 2.0
      max_ground_z_rel: 0.60
      min_range: 1.0
      max_range: 80.0
      forward_axis: "-y"

    odometry:
      enabled: true
      method: 4dof_icp
      lock_lateral: true
      lock_roll: true
      lock_vertical: false
      max_range: 120.0
      min_range: 1.0
      voxel_size: 0.5
      max_speed_mps: 30.0
      max_accel_mps2: 2.0
      max_iterations: 4
      max_correspondence_m: 2.0
      rest_translation_m: 0.20
      keep_ground: true
      forward_axis: "-y"

    tunnel_model:
      enabled: true
      voxel_size: 0.20
      free_space_margin: 0.15
      min_observations: 3
      free_hits_to_clear: 2
      max_range: 150.0
      carve_max_range: 90.0
      carve_half_width_m: 3.0
      carve_stride_az: 1
      carve_stride_ring: 1
      enable_decay: false
      decay_after_frames: 3000
      forget_ray_fraction: 0.02
      prior_map_path: ""
      process_period_s: 0.05
      pose_timeout_s: 1.0
      publish_points: true
      publish_divisor: 20
      publish_max_range_m: 60.0

    tunnel_profile:
      enabled: true
      alpha_initial: 0.30
      alpha_steady: 0.02
      warmup_frames: 200

    detector_no_return:
      enabled: true
      min_missing_run: 8
      max_missing_run_deg: 15.0
      azimuth_window: 5
      min_baseline_hits: 0.70
      min_range: 3.0

    detector_geometry:
      enabled: true
      median_half_window: 100
      median_window_override_min_range_m: 18.5
      median_window_override_max_range_m: 40.0
      median_half_window_override: 200
      median_window_override_min_range_m: 18.5
      median_window_override_max_range_m: 40.0
      median_half_window_override: 200
      residual_threshold_m: 1.0
      residual_threshold_far_m: 1.0
      min_cells: 50
      min_fill: 0.3
      min_range: 4.0
      max_target_range_m: 150.0
      far_range_m: 60.0
      min_cells_far: 8
      min_fill_far: 0.12
      min_stable_frames: 2
      az_tolerance: 20
      range_tolerance_m: 3.0

    detector_free_space:
      enabled: true
      min_confidence: 0.85
      min_range: 3.0
      max_range: 90.0
      min_free_observations: 10
      warmup_frames: 60
      require_multiple_observations: true

    gauge:
      forward_axis: "-y"
      half_width: 1.50
      height: 2.10
      base_offset: 0.20
      chamfer: 0.20
      nose_offset: 0.00
      sensor_height: 1.075
      max_range: 300.0
      safety_margin: 0.10

    clustering:
      neighbor_distance: 0.35
      adaptive_scaling: true
      reference_range: 50.0
      min_cluster_size_near: 15
      min_cluster_size_mid: 6
      min_cluster_size_far: 3
      size_near_range_m: 60.0
      size_mid_range_m: 120.0
      size_far_range_m: 200.0
      min_cluster_size_long: 2
      size_long_range_m: 300.0
      max_cluster_size: 20000
      min_extent_m: 0.20
      max_extent_m: 5.00

    tracking:
      max_association_distance: 2.0
      min_hits_to_confirm: 3
      min_hits_to_confirm_far: 5
      confirm_near_range_m: 60.0
      confirm_far_range_m: 120.0
      max_misses_to_keep: 4
      process_noise: 0.5
      measurement_noise: 0.3

    fusion:
      min_votes_for_alert: 1
      max_confirmed_track_misses: 4
      strict_track_freshness_range_m: 90.0
      require_confirmed_track: true
      critical_range_m: 50.0
      warning_range_m: 150.0
      critical_ttc_s: 3.0
      ground_filter: false
      ground_clearance_m: 0.45
      rail_zone_m: 2.0
      use_free_space: false
      free_space_min_confidence: 0.85
      free_space_min_points: 30
      free_space_min_cells: 30
      free_space_warmup_frames: 60
      update_model_with_clean_frames: true
      default_dt_s: 0.1
      stale_timeout_s: 1.0
      max_pending_frames: 16
      publish_markers: true
      marker_max_range_m: 60.0
      marker_max_obstacles: 16

    vehicle:
      speed_topic: ""
      default_speed_mps: 0.0
      braking_decel_mps2: 1.3
