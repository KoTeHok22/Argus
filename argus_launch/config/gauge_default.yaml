# Габарит движения поезда (допущение A1 из PLAN.md 18.5).
# Габарит - твёрдое тело (усечённая призма), а не проверка по высоте/ширине.
# Все значения - ПРЕДПОЛОЖЕНИЯ до уточнения по ТТХ "Москва-2024".
# Соглашение об осях: X вперёд, Y влево, Z вверх, начало - в лидаре.

gauge:
  half_width: 1.45      # м, половина ширины. УТОЧНИТЬ
  height: 3.60          # м от головки рельса. УТОЧНИТЬ
  base_offset: 0.20     # м от головки рельса до низа габарита
  chamfer: 0.20         # м, фаска по верхним углам
  nose_offset: 0.00     # м от лидара до носа поезда. УТОЧНИТЬ (допущение A2)
  max_range: 300.0      # м, предел проверки
  safety_margin: 0.10   # м, дополнительный запас

  # Установка лидара (для пересчёта в систему координат рельса)
  sensor:
    height_above_rail: 1.20   # м, высота лидара над головкой рельса
    behind_nose: 0.00         # м, насколько лидар утоплен от носа
