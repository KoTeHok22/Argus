version: "3.8"

services:
  argus:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: argus
    volumes:
      # Датасет конфиденциален - монтируется, не встраивается в образ
      - ../data/recordings:/data:ro
      - ../results:/ws/results
    working_dir: /ws
    command: ["help"]
