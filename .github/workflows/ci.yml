name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-22.04
    container: osrf/ros@sha256:592f97da6b871a438fdb97f86b422ab9f80657e80efa7b98d258894738c8a0c0
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            clang-format git python3-vcstool zstd libeigen3-dev \
            libyaml-cpp-dev libtbb-dev liblz4-dev
          rm -rf /var/lib/apt/lists/*

      - name: Lint
        run: bash scripts/ci/lint.sh

      - name: Third-party
        run: |
          mkdir -p third_party
          git clone --depth 1 https://github.com/url-kaist/patchwork-plusplus.git third_party/patchworkpp
          git -C third_party/patchworkpp fetch --depth 1 origin 3e6903a1d5537a4cc2ace897b0bbb98a92d6014c
          git -C third_party/patchworkpp checkout 3e6903a1d5537a4cc2ace897b0bbb98a92d6014c

      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
